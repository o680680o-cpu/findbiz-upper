services:
  - type: web
    name: findbiz-upper-680
    runtime: python
    region: singapore
    plan: free
    healthCheckPath: /health
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --timeout 120
    envVars:
      - key: TRADE_REFRESH
        value: "0"
